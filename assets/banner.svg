<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 1.5px; }

      /* Dynamic SVG Animations */
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(220px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.3; }
      }
      @keyframes pulse-box {
        0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5px; }
        50% { stroke-opacity: 1; stroke-width: 2.5px; }
      }
      @keyframes float-particle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .scanner { animation: scanline 6s ease-in-out infinite; }
      .bbox { animation: pulse-box 3s ease-in-out infinite; }
      .floating { animation: float-particle 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320"/>
  </g>

  <!-- Background Glow & Decorative Tech Elements -->
  <rect x="750" y="40" width="380" height="240" rx="12" fill="url(#glow-grad)" stroke="#818cf8" stroke-opacity="0.2"/>

  <!-- Dynamic Bounding Boxes (Custom Computer Vision Visuals) in Background -->
  <g class="bbox" stroke="#38bdf8" stroke-width="2" fill="none">
    <!-- Box 1 -->
    <rect x="780" y="70" width="160" height="120" rx="6" stroke-dasharray="6,4"/>
    <path d="M780 85 V70 H795 M925 70 H940 V85 M940 175 V190 H925 M795 190 H780 V175" stroke="#38bdf8" stroke-width="3"/>
    <rect x="780" y="50" width="110" height="20" fill="#38bdf8" rx="3"/>
    <text x="786" y="64" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">OBJECT: 99.4%</text>

    <!-- Box 2 -->
    <rect x="960" y="120" width="140" height="130" rx="6"/>
    <path d="M960 135 V120 H975 M1085 120 H1100 V135 M1100 235 V250 H1085 M975 250 H960 V235" stroke="#c084fc" stroke-width="3"/>
    <rect x="960" y="100" width="100" height="20" fill="#c084fc" rx="3"/>
    <text x="966" y="114" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">MODEL: YOLO</text>
  </g>

  <!-- Dynamic Scan Line -->
  <line class="scanner" x1="750" y1="50" x2="1130" y2="50" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>

  <!-- Foreground Content (Text guaranteed visible and crisp above background) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <text x="0" y="90" class="tag">CURATED AWESOME LIST</text>

    <!-- Title -->
    <text x="0" y="150" class="title">Awesome Custom Computer Vision</text>

    <!-- Gradient Decorative Line under Title -->
    <rect x="0" y="170" width="620" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle">SaaS Platforms, Edge AI, AutoML &amp; Open-Source Frameworks</text>

    <!-- Key Feature Badges in Banner -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="16" y="18" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">☁️ SaaS Tools</text>

      <rect x="142" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="158" y="18" font-family="sans-serif" font-size="12" fill="#818cf8" font-weight="600">🔓 Open-Source</text>

      <rect x="294" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.5"/>
      <text x="310" y="18" font-family="sans-serif" font-size="12" fill="#c084fc" font-weight="600">⚡ Edge AI &amp; YOLO</text>
    </g>
  </g>
</svg>
